# 交付流水线左移门禁（见 docs/DELIVERY-PIPELINE.md §1 §2 §8）
#
# 本文件只做「快且能阻断」的检查：密钥、依赖漏洞、类型、覆盖率、提交规范。
# 真机链路（install.cmd / control.cmd 双击、Windows 能力）留在 windows-e2e.yml
# —— 那一环跑得慢但价值最高，不可被这条更快的流水线替代。
#
# ⚠️ 阈值说明（别照搬通用 80%）：详见 docs/DELIVERY-PIPELINE.md §2。
#    全量覆盖率当前基线约 66.9%，故全量只观测；阻断只针对**变更文件**（≥70%）。

name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ① 代码审计：密钥 + 依赖漏洞
  audit:
    name: 代码审计（密钥 + 依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks 扫历史提交，需要完整历史
          fetch-depth: 0

      # 密钥扫描：nodeagent 的密钥面比一般项目大 ——
      # PSK、Ed25519 私钥、TLS 自签证书、PSK.txt、agent.json
      - name: 密钥与敏感信息扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          # 与本仓库其他工作流保持一致（console-windows.yml / rust.yml / windows-e2e.yml 均为 12）
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      # 依赖漏洞：High 及以上阻断
      - name: 依赖漏洞扫描（SCA）
        # ⚠️ 必须显式指定公共 registry（2026-10-17）
        # 仓库 `.npmrc` 指向 registry.npmmirror.com（镜像加速），但**镜像不实现
        # audit 接口**，`pnpm audit` 会直接报 ERR_PNPM_AUDIT_ENDPOINT_NOT_EXISTS。
        # 结果就是这道门禁从加上那天起**一直是红的**，等于没有门禁。
        run: pnpm audit --audit-level=high --registry=https://registry.npmjs.org

  # ② 质量门禁：类型 + 覆盖率
  gate:
    name: 质量门禁（类型 + 覆盖率）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 覆盖率门禁要算「变更文件」，需与基线做 diff
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          # 与本仓库其他工作流保持一致（console-windows.yml / rust.yml / windows-e2e.yml 均为 12）
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      # ⚠️ 必须先构建 `@nodeagent/protocol` 再查类型（2026-10-17）
      # 各包 import 的是 `@nodeagent/protocol` 的**类型产物**（dist/*.d.ts）。
      # CI 里全新检出、没有 dist，直接 typecheck 会集体报
      # `TS2307: Cannot find module '@nodeagent/protocol'` —— 而本地因为 dist 还在，
      # 看不出问题（典型的「本地绿 / CI 红」）。
      # 只构建 protocol 而不跑全量 build：够用且快，全量 build 留给下一步。
      - name: 构建 protocol 类型产物
        run: pnpm --filter @nodeagent/protocol build

      - run: pnpm typecheck

      # 单测 import 的是 dist/（编译产物），必须先构建，否则覆盖率全空
      - run: pnpm -r build

      - name: 采集覆盖率
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage \
               --test-reporter=lcov \
               --test-reporter-destination=coverage/lcov.info \
               "tests/unit/**/*.test.mjs"

      - name: 覆盖率门禁
        run: node scripts/ci/check-coverage.mjs --lcov coverage/lcov.info --base origin/main --threshold 70

      # coverage/ 已在 .gitignore 中，此处留档便于人工查看
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ③ 提交信息规范
  commits:
    name: 提交信息规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验 Conventional Commits
        run: node scripts/ci/check-commit-msg.mjs --base ${{ github.event.pull_request.base.sha }}
