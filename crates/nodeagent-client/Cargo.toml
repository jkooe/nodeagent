[package]
name = "nodeagent-client"
version = "0.1.0"
edition = "2021"
description = "nodeagent 控制端 Rust 客户端（行为对齐 @nodeagent/client）"
license = "MIT"

[dependencies]
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8"] }
futures-util = "0.3.34"
hmac = "0.13.0"
rand = "0.10.3"
rustls = "0.23.45"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"
